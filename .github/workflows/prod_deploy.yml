name: 🔨📂 Build & Deploy to PROD

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: 🔨 Build Project
        run: pnpm run build

      - id: deployProd
        name: 📂 Sync files to prod folder
        continue-on-error: true
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.server }}
          username: ${{ secrets.username }}
          password: ${{secrets.password}}
          localDir: "./dist/"
          remoteDir: "./"
          port: 22

      - name: 🔁 Retry PROD upload if handshake failed
        if: steps.deployProd.outcome == 'failure'
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.server }}
          username: ${{ secrets.username }}
          password: ${{secrets.password}}
          localDir: "./dist/"
          remoteDir: "./"
          port: 22
